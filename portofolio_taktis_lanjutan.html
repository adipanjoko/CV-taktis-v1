    <style>
        :root {
            --neon-cyan: #00f0ff;
            --neon-purple: #b026ff;
            --neon-magenta: #ff003c;
            --neon-emerald: #10b981;
            --neon-amber: #f59e0b;
            --dark-bg: #030712;
            --panel-bg: rgba(15, 23, 42, 0.75);
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: var(--dark-bg);
            color: #e2e8f0;
            font-family: 'Rajdhani', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        h1, h2, h3, .orbitron {
            font-family: 'Orbitron', sans-serif;
        }

        .japanese-text {
            font-family: 'Noto Sans JP', sans-serif;
        }

        /* Efek Garis Pindai (Scanlines) */
        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.15) 50%,
                rgba(0,0,0,0.15)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 50;
            opacity: 0.5;
        }

        /* Gaya Panel Kaca (Glassmorphism) */
        .cyber-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 240, 255, 0.2);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.6), inset 0 0 15px rgba(0, 240, 255, 0.05);
            position: relative;
        }
        
        /* Dekorasi Sudut Futuristik */
        .cyber-panel::before, .cyber-panel::after {
            content: '';
            position: absolute;
            width: 15px;
            height: 15px;
            border: 2px solid var(--neon-cyan);
            transition: all 0.3s ease;
        }
        .cyber-panel::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
        .cyber-panel::after { bottom: -1px; right: -1px; border-left: none; border-top: none; }

        /* Navigasi Node */
        .nav-node {
            position: relative;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            border-left: 3px solid transparent;
        }
        .nav-node:hover {
            border-left: 3px solid var(--neon-cyan);
            background: rgba(0, 240, 255, 0.1);
            padding-left: 1rem;
        }
        .nav-node.active {
            border-left: 3px solid var(--neon-cyan);
            background: linear-gradient(90deg, rgba(0, 240, 255, 0.2) 0%, rgba(0,0,0,0) 100%);
            padding-left: 1.5rem;
        }
        .nav-node.active .node-id { color: var(--neon-cyan); text-shadow: 0 0 8px var(--neon-cyan); }
        
        /* Animasi Konten Masuk */
        .animate-enter {
            animation: slideUpFade 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes slideUpFade {
            0% { opacity: 0; transform: translateY(30px) scale(0.98); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Latar Belakang Kanvas */
        #tactical-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 0;
        }

        /* Scrollbar Khusus */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.5); border-left: 1px solid rgba(0,240,255,0.1); }
        ::-webkit-scrollbar-thumb { background: rgba(0, 240, 255, 0.4); }
        ::-webkit-scrollbar-thumb:hover { background: var(--neon-cyan); }
        
        .text-shadow-glow {
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.7);
        }

                particles.push({

                    const mdist = Math.sqrt(mdx * mdx + mdy * mdy);
                    
                    if (mdist < 150) {
                        const alpha = 1 - (mdist / 150);
                        ctx.strokeStyle = `rgba(0, 240, 255, ${alpha * 0.5})`;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(mouse.x, mouse.y);
                        ctx.stroke();
                    }
                }
            }
        }

        // Putaran Animasi Utama
        function animate() {
            drawParticles();
            requestAnimationFrame(animate);
        }

        // Memulai setelah window dimuat
        window.onload = function() {
            animate();
        };

    </script>
</body>
</html>
